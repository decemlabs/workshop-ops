# Прод-сборка целиком: Caddy с собранным фронтом, gunicorn и Postgres.
#
#   docker compose -f compose.prod.yaml up -d --build     поднять
#   docker compose -f compose.prod.yaml down              остановить
#
# Переменные — в .env рядом с этим файлом

name: workshop-ops-prod

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-workshop_ops}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-workshop_ops}',
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY обязателен}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-}
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-workshop_ops}
      # Наружу смотрит Caddy этой же связки, по http - иначе редирект на https зациклится
      HTTPS_ONLY: ${HTTPS_ONLY:-False}
    volumes:
      - staticfiles:/app/staticfiles
    # Обе команды идемпотентны, поэтому идут на каждом старте связки.
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             exec gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3"
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./frontend
    restart: unless-stopped
    ports:
      - '${WEB_PORT:-8080}:80'
    volumes:
      - staticfiles:/var/www/static:ro
    depends_on:
      - backend

volumes:
  pgdata:
  staticfiles:
