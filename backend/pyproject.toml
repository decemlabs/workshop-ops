[project]
name = "workshop-ops-backend"
version = "0.1.0"
description = "Backend для управления цехами, рабочими и задачами"
requires-python = ">=3.14"
dependencies = [
    "django>=6.1",
    "django-environ>=0.14.0",
    "django-filter>=26.1",
    "djangorestframework>=3.18.0",
    "gunicorn>=23.0.0",
    "psycopg[binary]>=3.3.4",
]

[dependency-groups]
dev = [
    "django-types>=0.24.0",
    "pytest>=9.1.1",
    "pytest-django>=4.14.0",
    "ruff>=0.16.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "src/config",
    "src/apps",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.local"
python_files = ["test_*.py", "*_test.py", "tests.py"]
testpaths = ["src"]

[tool.ruff]
target-version = "py314"
line-length = 100
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "DJ",   # flake8-django
    "RUF",  # ruff-specific
]
ignore = [
    "RUF012",
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"src/config/settings/local.py" = ["F403", "F405"]
"src/config/settings/production.py" = ["F403", "F405"]

[tool.ruff.lint.isort]
known-first-party = ["config", "apps"]

[tool.ruff.format]
quote-style = "single"

[tool.basedpyright]
venvPath = "."
venv = ".venv"
include = ["src", "manage.py"]
exclude = ["**/migrations", "**/__pycache__", "**/.venv"]
extraPaths = ["src"]
typeCheckingMode = "standard"
