# Локальная инфраструктура проекта.
#
#   docker compose up -d          поднять
#   docker compose down           остановить (данные остаются в volume)
#   docker compose down -v        остановить и удалить данные

name: workshop-ops

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-workshop_ops}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-workshop_ops}',
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    command: ['postgres', '-c', 'log_min_messages=warning']

volumes:
  pgdata:
